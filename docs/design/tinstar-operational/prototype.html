function formatClock(s){if(!s)return '—';let d=parseDemo(s);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}).replace(' AM','a').replace(' PM','p')}
function dateDay(s){return s?parseDemo(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'}):'—'}
function ago(s){const n=(demoNow-parseDemo(s))/60000;if(n<60)return Math.max(1,Math.floor(n))+'m ago';if(n<1440)return Math.floor(n/60)+'h ago';return Math.floor(n/1440)+'d ago'}
function statusTone(s){if(s==='In Progress'||s==='Running')return 'progress';if(s==='Waiting For'||s==='Waiting')return 'wait';if(s==='Ready for Review')return 'review';if(s==='Done')return 'done';return 'planned'}
function duration(s){if(!s)return 'Not scheduled';let m=(parseDemo(s)-demoNow)/60000;if(m<0)return 'Overdue '+(m>-60?Math.abs(Math.ceil(m))+'m':Math.abs(Math.ceil(m/60))+'h');if(m<=240)return 'Check-in '+formatClock(s);return 'Check-in '+dateDay(s)+' · '+formatClock(s)}
function compareDate(s){return s?parseDemo(s).getTime():Number.POSITIVE_INFINITY}
function dateBucket(s,f){if(!s)return 'Not scheduled';let ms=parseDemo(s).getTime()-demoNow.getTime(),days=Math.floor(ms/86400000);let today=new Date('2026-11-04T00:00:00-05:00').getTime(),start=parseDemo(s).getTime(),dayDiff=Math.floor((start-today)/86400000);if(f==='check' && ms<0)return 'Overdue';if(f==='edited'||f==='activityAt')return dayDiff>=0?'Today':dayDiff===-1?'Yesterday':dayDiff>=-7?'Earlier this week':'Older';if(dayDiff<=-1)return 'Overdue';if(dayDiff===0)return 'Today';if(dayDiff===1)return 'Tomorrow';if(dayDiff<=7)return 'This week';return 'Later'}
function rawVal(obj,f){return obj?obj[f]:undefined}
function fieldVals(row, field){if(field==='none')return ['All work'];const f=fieldById[field];if(!f)return ['Unassigned'];let values=[];if(f.source==='task'){if(row.task)values=[rawVal(row.task,field)];}else if(f.source==='worker'){values=row.workers.map(w=>rawVal(w,field));}else{values=row.task?[rawVal(row.task,field)]:row.workers.map(w=>rawVal(w,field));}values=values.filter(v=>v!==null && v!==undefined && v!=='');if(f.type==='date')values=values.map(v=>dateBucket(v,field));if(!values.length)return ['Unassigned'];return [...new Set(values.map(String))]}
function sortVal(row,f){const meta=fieldById[f];if(!meta)return '';const vals=meta.source==='worker'?row.workers.map(w=>w[f]):meta.source==='both'?(row.task?[row.task[f]]:row.workers.map(w=>w[f])):row.task?[row.task[f]]:[];const usable=vals.filter(v=>v!==null&&v!==undefined&&v!=='');if(!usable.length)return null;if(meta.type==='date')return Math.min(...usable.map(compareDate));if(meta.type==='priority')return Math.min(...usable.map(v=>priorityRank[v]??50));return String(usable[0]).toLowerCase()}
function cmpRows(a,b){const av=sortVal(a,state.order),bv=sortVal(b,state.order);if(av===null && bv===null)return a.id.localeCompare(b.id);if(av===null)return 1;if(bv===null)return -1;let n=typeof av==='number' && typeof bv==='number'?av-bv:String(av).localeCompare(String(bv));return (state.asc?n:-n)||a.id.localeCompare(b.id)}
function buildRows(){const visible=tasks.filter(t=>state.showDone||t.status!=='Done');const rows=visible.map(t=>({id:'row:'+t.id,task:t,workers:links.filter(([,tid])=>tid===t.id).map(([wid])=>workerMap[wid]).filter(Boolean)}));const seen=new Set(rows.flatMap(row=>row.workers.map(w=>w.id)));workers.filter(w=>!seen.has(w.id)).forEach(w=>rows.push({id:'row:solo:'+w.id,task:null,workers:[w]}));return rows}
function grouping(rows){const outer=new Map();for(const row of rows){for(const o of fieldVals(row,state.outer)){if(!outer.has(o))outer.set(o,new Map());const map=outer.get(o);for(const i of fieldVals(row,state.inner)){if(!map.has(i))map.set(i,[]);map.get(i).push(row);}}}const out=[...outer].sort(([a],[b])=>compareGroup(a,b,state.outer));return out.map(([o,map])=>({key:o,inner:[...map].sort(([a],[b])=>compareGroup(a,b,state.inner)).map(([i,list])=>({key:i,rows:[...new Map(list.map(r=>[r.id,r])).values()].sort(cmpRows)}))}));}
function compareGroup(a,b,field){if(a==='Unassigned')return 1;if(b==='Unassigned')return -1;if(field==='status'){let r=['In Progress','Ready for Review','In review','Waiting For','Waiting','Waiting for Prod Release','Queued','Todo','Backlog','Spare tokens','Done'];return (r.indexOf(a)<0?99:r.indexOf(a))-(r.indexOf(b)<0?99:r.indexOf(b));}if(field==='priority')return (priorityRank[a]??99)-(priorityRank[b]??99);if(['check','due'].includes(field)){let r=['Overdue','Today','Tomorrow','This week','Later','Not scheduled'];return r.indexOf(a)-r.indexOf(b)}if(['edited','activityAt'].includes(field)){let r=['Today','Yesterday','Earlier this week','Older','Not scheduled'];return r.indexOf(a)-r.indexOf(b)}return a.localeCompare(b)}

function taskHTML(t,ref){const done=t.status==='Done',ch=t.check&&t.status==='In Progress';return `<button class="record rec-task ${done?'rec-completed':''} ${ref?'reference':''} ${state.selected===t.id?'selected':''} ${state.deskFocus===t.id?'desk-target':''}" type="button" data-record="${esc(t.id)}" data-type="task"><i class="port"></i><div class="rec-top"><span class="crumb">${esc(t.initiative)} / ${esc(t.epic)}</span><span class="prio ${esc(t.priority.toLowerCase())}">${esc(t.priority)}</span></div><div class="rec-title">${esc(t.title)}</div><div class="rec-meta"><span class="status ${statusTone(t.status)}"><span class="dot"></span>${esc(t.status)}</span><span class="rec-owner">♙ ${esc(t.owner)}</span></div><div class="rec-bottom"><span class="check ${ch&&parseDemo(t.check)<demoNow?'overdue':''} ${!ch?'quiet':''}">${ch?'◷ '+duration(t.check):t.wait?'↳ '+esc(t.wait):t.status==='Ready for Review'?'↳ Review requested':t.status==='Backlog'?'◷ Not scheduled':'◷ No active check-in'}</span><span class="editing">Edited ${ago(t.edited)}</span></div>${ref?`<span class="refmark">↗ reference</span>`:''}</button>`}
function workerHTML(w,ref){return `<button class="record rec-worker ${ref?'reference':''} ${state.selected===w.id?'selected':''}" type="button" data-record="${esc(w.id)}" data-type="worker"><i class="port"></i><span class="robot ${w.state.toLowerCase()==='running'?'active':'waiting'}">${w.avatar}</span><div class="rec-top"><span class="crumb">${esc(w.initiative)} / ${esc(w.epic)}</span><span class="state-tag ${w.state.toLowerCase()}"><span class="dot"></span><b>${esc(w.state)}</b></span></div><div class="rec-title">${esc(w.title)}</div><div class="rec-meta"><span class="left"><span class="rec-owner">▣ ${esc(w.machine)} &nbsp;·&nbsp; ${esc(w.manager)}</span></span></div><div class="rec-bottom"><span class="check">⌁ ${esc(w.activity)}</span><span class="editing">${esc(w.ago)}</span></div>${ref?`<span class="refmark">↗ same worker</span>`:''}</button>`}
function rowHTML(r,refs){let wt=r.workers.map(w=>workerHTML(w,(refs.w.get(w.id)||0)>1)).join('');return `<div class="pair-row" data-row="${esc(r.id)}"><div class="pair-column left-side">${wt||'<div class="row-empty">No linked worker</div>'}</div><div class="connector"><svg class="link-svg" preserveAspectRatio="none"></svg>${!wt||!r.task?'<span class="empty-relation">'+(!r.task?'no task':'no worker')+'</span>':''}</div><div class="pair-column right-side">${r.task?taskHTML(r.task,(refs.t.get(r.task.id)||0)>1):'<div class="row-empty">No linked task</div>'}</div></div>`}
function renderGroups(){const arr=grouping(buildRows()),refs=getRefs(arr);let totalRows=0;$('#floor').innerHTML=arr.map(outer=>{const collapsed=state.collapsed.has('outer:'+outer.key);const allRows=outer.inner.flatMap(x=>x.rows),cnt=counts(allRows);totalRows+=allRows.length;return `<section class="outer" data-outer="${esc(outer.key)}"><div class="outer-head"><button type="button" class="collapse" data-toggle="outer:${esc(outer.key)}">${collapsed?'+':'−'}</button><strong>${esc(outer.key)}</strong><small>${fieldById[state.outer]?.label||'All work'}</small><span class="stat">${cnt.w} workers · ${cnt.t} tasks</span></div>${collapsed?'':`<div class="outer-body">${outer.inner.map(inner=>{const key='inner:'+outer.key+'|'+inner.key,col=state.collapsed.has(key),c=counts(inner.rows);return `<section class="inner"><div class="inner-head"><button type="button" data-toggle="${esc(key)}">${col?'+':'−'}</button><strong>${esc(inner.key)}</strong><span>${c.w} W · ${c.t} T</span></div>${col?'':`<div class="inner-content">${inner.rows.map(r=>rowHTML(r,refs)).join('')}</div>`}</section>`}).join('')}</div>`}</section>`}).join('')||'<div class="empty-results">No work matches the current filters.</div>';

 $('#floorSummary').textContent=`· ${arr.length} outer groups`;$$('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.toggle;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);renderGroups()}));$$('[data-record]').forEach(b=>{b.addEventListener('click',()=>inspect(b.dataset.record));b.addEventListener('mouseenter',()=>hover(b.dataset.record));b.addEventListener('mouseleave',()=>hover(null))});requestAnimationFrame(drawLinks);
}
function drawLinks(){$$('.pair-row').forEach(row=>{let svg=row.querySelector('.link-svg'),c=row.querySelector('.connector');if(!svg||!c)return;let ww=c.clientWidth,h=c.clientHeight;svg.setAttribute('viewBox',`0 0 ${ww} ${h}`);svg.style.height=h+'px';svg.innerHTML='';if(!state.showLinks)return;let t=row.querySelector('.rec-task');if(!t)return;let cbox=c.getBoundingClientRect(),tbox=t.getBoundingClientRect();let ty=tbox.top+tbox.height/2-cbox.top;let workers=[...row.querySelectorAll('.rec-worker')];for(let el of workers){let wbox=el.getBoundingClientRect(),wy=wbox.top+wbox.height/2-cbox.top,dy=Math.max(13,ww*.30);let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M 0 ${wy} C ${dy} ${wy}, ${ww-dy} ${ty}, ${ww} ${ty}`);path.dataset.a=el.dataset.record;path.dataset.b=t.dataset.record;path.classList.toggle('highlight',state.selected===el.dataset.record || state.selected===t.dataset.record || state.deskFocus===t.dataset.record || state.hover===el.dataset.record || state.hover===t.dataset.record);svg.appendChild(path)}})}
function hover(id){state.hover=id;$$('[data-record]').forEach(b=>{if(!id){b.classList.remove('linkhover');return;}const linked=links.some(([w,t])=>(id===w&&b.dataset.record===t)||(id===t&&b.dataset.record===w));b.classList.toggle('linkhover',linked)});drawLinks()}
function renderDesk(){
 const items=tasks.filter(t=>t.owner==='Will' && t.action && t.status!=='Done' && t.status!=='Archived');
 $('#deskCount').textContent=`${items.length} cards need you`;
 $('#deskList').innerHTML=`<h3>NEEDS YOU</h3>`+items.map(t=>`<button type="button" class="desk-card ${state.deskFocus===t.id?'active':''}" data-desk-task="${esc(t.id)}" aria-current="${state.deskFocus===t.id?'true':'false'}"><span class="desk-card-top"><span class="desk-action-type">${esc(t.action)}</span><span class="desk-card-meta">${esc(t.priority)} priority</span></span><strong>${esc(t.title)}</strong><span class="desk-card-bottom"><span>${esc(t.status)}</span><span>${esc(t.initiative)}</span></span></button>`).join('');
 $$('[data-desk-task]').forEach(btn=>btn.addEventListener('click',()=>jumpToDeskCard(btn.dataset.deskTask)));
}
function jumpToDeskCard(id){
 const task=taskMap[id];if(!task)return;
 // Reveal a valid instance of this actual task under the current grouping.
 // Do not change Outer, Inner, Order, relationship assignments, or the card itself.
 if(task.status==='Done'&&!state.showDone)state.showDone=true;
 const groups=grouping(buildRows());
 const outer=groups.find(g=>g.inner.some(z=>z.rows.some(r=>r.task?.id===id)));
 const inner=outer?.inner.find(z=>z.rows.some(r=>r.task?.id===id));
 if(!outer || !inner){toast('Card unavailable in this view');return;}
 state.collapsed.delete('outer:'+outer.key);
 state.collapsed.delete('inner:'+outer.key+'|'+inner.key);
 closeInspector();
 state.deskFocus=id;
 render();
 const matches=$$('.rec-task').filter(el=>el.dataset.record===id);
 if(!matches.length){toast('Card unavailable in this view');return;}
 const el=matches[0];
 el.classList.remove('desk-flash');void el.offsetWidth;
 el.classList.add('desk-flash');
 const reduce=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 requestAnimationFrame(()=>{
   el.scrollIntoView({behavior:reduce?'instant':'smooth',block:'center'});
   el.focus({preventScroll:true});
   setTimeout(()=>{if(el.isConnected)el.classList.remove('desk-flash')},1850);
 });
}
function renderSettings(){for(let slot of ['outer','inner','order']){let select=$('#'+slot);let choices=(slot==='order'?fields:[{id:'none',label:'None / one group'},...fields]);select.innerHTML=choices.map(f=>`<option value="${esc(f.id)}">${esc(f.label)}</option>`).join('');select.value=state[slot]};$('#direction').textContent=state.asc?'↑':'↓';$('#direction').title=state.asc?'Ascending · click to reverse':'Descending · click to reverse';$('#showDone').checked=state.showDone;$('#showLinks').checked=state.showLinks;$$('[data-preset]').forEach(b=>{let p=PRESETS[b.dataset.preset];b.classList.toggle('active',p&&p.outer===state.outer&&p.inner===state.inner&&p.order===state.order&&p.asc===state.asc)});}
function render(){renderSettings();renderGroups();renderDesk()}
function applySlot(slot,value){if(slot==='order'&&value==='none')return;state[slot]=value;state.collapsed.clear();render();toast(`${fieldById[value]?.label||'None'} → ${slot.toUpperCase()}`)}
function buildPalette(){const sourceLabel={task:'TASK',worker:'WORKER',both:'BOTH'};$('#palette').innerHTML=fields.map(f=>`<button type="button" class="chip ${f.source}-source" draggable="true" data-field="${esc(f.id)}" title="Drag into Outer, Inner or Order, or click to choose"><span class="tiny">${sourceLabel[f.source]}</span>${esc(f.label)} <span style="color:#65838d">⋮⋮</span></button>`).join('');$$('.chip').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.field);e.dataTransfer.effectAllowed='copy'});el.addEventListener('click',()=>{const field=fieldById[el.dataset.field];const existing=$('#placementMenu');if(existing)existing.remove();let menu=document.createElement('div');menu.id='placementMenu';menu.setAttribute('role','dialog');menu.setAttribute('aria-label','Choose slot for '+field.label);menu.style.cssText='position:fixed;z-index:30;background:#1a333c;border:1px solid #548996;padding:10px;box-shadow:0 8px 30px #0008;border-radius:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;max-width:300px';const r=el.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(innerWidth-310,r.left))+'px';menu.style.top=Math.min(innerHeight-65,r.bottom+7)+'px';menu.innerHTML=`<span style="width:100%;font-size:11px;color:#d9eff1;margin-bottom:4px">Place <b>${esc(field.label)}</b> in…</span>`+['outer','inner','order'].map(k=>`<button data-set="${k}" style="font-size:11px;padding:7px;border:1px solid #4b8088;background:#10313a;border-radius:4px">${k.toUpperCase()}</button>`).join('')+'<button data-cancel="yes" style="background:none;border:0;font-size:13px">×</button>';document.body.appendChild(menu);menu.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{applySlot(b.dataset.set,field.id);menu.remove()}));menu.querySelector('[data-cancel]').onclick=()=>menu.remove();setTimeout(()=>document.addEventListener('click',function away(e){if(!menu.contains(e.target)&&!el.contains(e.target)){menu.remove();document.removeEventListener('click',away)}},{capture:true}),0);});});$$('.slot').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');e.dataTransfer.dropEffect='copy'});el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drag-over')});el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(fieldById[id])applySlot(el.dataset.slot,id)})});}
function inspect(id){const t=taskMap[id],w=workerMap[id],item=t||w;if(!item)return;state.selected=id;let rows=t?[
 ['Initiative / Epic',t.initiative+' / '+t.epic],['Status',t.status],['Owner',t.owner],['Priority',t.priority],['Next check-in',t.check?dateDay(t.check)+' '+formatClock(t.check):'Not scheduled'],['Last edited',dateDay(t.edited)+' '+formatClock(t.edited)],['Last touched by',t.touched],['Due date',t.due?dateDay(t.due):'Not set'],['Waiting for',t.waiting||'—'],['Will action',t.action||'None'],['Area / Sub-area',t.area+' / '+t.subArea]
]:[['Initiative / Epic',w.initiative+' / '+w.epic],['Status',w.state],['Machine',w.machine],['Manager',w.manager],['Latest activity',w.activity],['Last reported',w.ago]];
 const related=t?links.filter(([,tid])=>tid===id).map(([wid])=>workerMap[wid]?.title).filter(Boolean):links.filter(([wid])=>wid===id).map(([,tid])=>taskMap[tid]?.title).filter(Boolean);
 $('#insHead').textContent=t?'Notion task details':'Worker details';$('#insBody').innerHTML=`<div class="eyebrow">${t?'NOTION / TASK':'FIRST MATE / WORKER'}</div><h2>${esc(item.title)}</h2><div class="status ${statusTone(t?t.status:w.state)}"><span class="dot"></span>${esc(t?t.status:w.state)}</div><dl class="detailgrid">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><h3>Related records</h3><div class="ins-row">${related.length?related.map(s=>`<p>↔ ${esc(s)}</p>`).join(''):'No confirmed relationships in this sample'}</div>`;
 $('#shade').classList.add('open');$('#inspector').classList.add('open');$$('[data-record]').forEach(b=>b.classList.toggle('selected',b.dataset.record===id));requestAnimationFrame(drawLinks);$('#closeIns').focus();}
function closeInspector(){state.selected=null;$('#shade').classList.remove('open');$('#inspector').classList.remove('open');$$('[data-record]').forEach(b=>b.classList.remove('selected'));requestAnimationFrame(drawLinks)}
let toastTimer=null;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function wire(){buildPalette();$('#fieldsToggle').addEventListener('click',()=>{const pane=$('#advancedFields');pane.hidden=!pane.hidden;$('#fieldsToggle').setAttribute('aria-expanded',String(!pane.hidden));$('#fieldsChevron').textContent=pane.hidden?'▾':'▴';});for(let s of ['outer','inner','order'])$('#'+s).addEventListener('change',e=>applySlot(s,e.target.value));$('#direction').addEventListener('click',()=>{state.asc=!state.asc;render();toast(`Sorting ${state.asc?'ascending':'descending'}`)});$('#reset').addEventListener('click',()=>{Object.assign(state,{...PRESETS.accountability,showDone:false,showLinks:true});state.collapsed.clear();closeInspector();render();toast('Default view restored')});$$('[data-preset]').forEach(b=>b.addEventListener('click',()=>{Object.assign(state,PRESETS[b.dataset.preset]);state.collapsed.clear();render();toast('Preset applied')}));$('#showDone').addEventListener('change',e=>{state.showDone=e.target.checked;renderGroups()});$('#showLinks').addEventListener('change',e=>{state.showLinks=e.target.checked;drawLinks()});$('#closeIns').addEventListener('click',closeInspector);$('#shade').addEventListener('click',closeInspector);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInspector();$('#placementMenu')?.remove()}});window.addEventListener('resize',()=>requestAnimationFrame(drawLinks));}
wire();render();
</script>
