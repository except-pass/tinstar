name: CI

# Ratchet: the tsc baseline was driven to zero (see docs/testing.md). This gate
# fails the build on ANY new type error so it can't regrow, and runs the unit
# suite. Keep it green — if you must add a type error, fix it, don't widen this.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    # noble, not jammy: jammy's archive ttyd is 1.6.3, which predates the `-H`
    # auth-header flag entirely and sits below TTYD_MIN_VERSION. The live proofs
    # below spawn ttyd with `-H`, so on jammy they would fail against a build the
    # spawner itself refuses — proving containment on a binary we forbid.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2

      # ttyd and tmux are what the terminal-containment guards are proven
      # against. Without them the live bind proof and the auth-header proof
      # call it.skip() and the suite goes green having tested nothing — the
      # exact silent-pass this project documents in
      # docs/solutions/conventions/verify-a-guard-by-breaking-it.md.
      - name: Install live test dependencies
        run: sudo apt-get update && sudo apt-get install -y ttyd tmux nats-server

      - name: Install dependencies
        run: npm ci

      # Catches case-only filename collisions that build on this Linux runner but
      # break module resolution on the macOS/Windows release runners — the silent
      # failure mode that blocked the v5.2.0 release. See docs/releasing.md.
      - name: Case-collision guard
        run: npm run check:case

      - name: Typecheck (tsc must report zero errors)
        run: npm run typecheck

      - name: Unit tests
        # Fails rather than skips if ttyd went missing from the runner image.
        env:
          TINSTAR_REQUIRE_LIVE_TTYD: '1'
          # Same reasoning for the sudoers rule: its only real-parser proof is
          # skippable, and the bug it guards shipped once already.
          TINSTAR_REQUIRE_LIVE_VISUDO: '1'
          # The inherited-MCP boundary must also run against the exact pinned
          # production channel runtime, not only its fast protocol fixture.
          TINSTAR_REQUIRE_NATS_CHANNEL_RUNTIME: '1'
        run: npm run test:unit
