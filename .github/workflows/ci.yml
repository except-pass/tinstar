name: CI

# Ratchet: the tsc baseline was driven to zero (see docs/testing.md). This gate
# fails the build on ANY new type error so it can't regrow, and runs the unit
# suite. Keep it green — if you must add a type error, fix it, don't widen this.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  published-puller-contract:
    name: Published Mac puller contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build PR server
        run: npm run build:server
      - name: Verify published puller version, digest and owner round trip
        # Fixture and stubs are local; no clavis, First Mate, or external APIs.
        run: npm run test:published-puller

  typecheck-and-test:
    # noble, not jammy: jammy's archive ttyd is 1.6.3, which predates the `-H`
    # auth-header flag entirely and sits below TTYD_MIN_VERSION. The live proofs
    # below spawn ttyd with `-H`, so on jammy they would fail against a build the
    # spawner itself refuses — proving containment on a binary we forbid.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2

      # ttyd and tmux are what the terminal-containment guards are proven
      # against. Without them the live bind proof and the auth-header proof
      # call it.skip() and the suite goes green having tested nothing — the
      # exact silent-pass this project documents in
      # docs/solutions/conventions/verify-a-guard-by-breaking-it.md.
      # Prevent apt failing before tests when Azure's Ubuntu mirror DNS is unavailable.
      - &ubuntu-mirror-fallback
        name: Fall back when Ubuntu Azure mirror DNS fails
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo 'Azure Ubuntu mirror DNS unavailable; using http://archive.ubuntu.com/ubuntu'
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
              -exec sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} +
          fi

      - name: Install live test dependencies
        run: sudo apt-get update && sudo apt-get install -y ttyd tmux nats-server bubblewrap shellcheck

      # Noble restricts unprivileged user namespaces even with bwrap installed.
      # Allow only bwrap to create them; keep the host-wide restriction enabled.
      - name: Permit bubblewrap isolation through AppArmor
        run: |
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tinstar-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE

      - name: Install dependencies
        run: npm ci

      - *ubuntu-mirror-fallback

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      # Catches case-only filename collisions that build on this Linux runner but
      # break module resolution on the macOS/Windows release runners — the silent
      # failure mode that blocked the v5.2.0 release. See docs/releasing.md.
      - name: Deploy script lint
        run: shellcheck scripts/deploy/floor-deploy.sh

      - name: Case-collision guard
        run: npm run check:case

      - name: Typecheck (tsc must report zero errors)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Codex collector tests
        run: npm run test:codex-collector

      - name: Unit tests
        # Fails rather than skips if ttyd went missing from the runner image.
        env:
          TINSTAR_REQUIRE_LIVE_TTYD: '1'
          # Same reasoning for the sudoers rule: its only real-parser proof is
          # skippable, and the bug it guards shipped once already.
          TINSTAR_REQUIRE_LIVE_VISUDO: '1'
          # The inherited-MCP boundary must also run against the exact pinned
          # production channel runtime, not only its fast protocol fixture.
          TINSTAR_REQUIRE_NATS_CHANNEL_RUNTIME: '1'
        run: npm run test:unit

  browser-suite:
    name: browser-suite
    # Public repo: GitHub-hosted runners, not a self-hosted runner on the farm.
    # One job. Shard only after a run's wall clock exceeds about 20 minutes.
    # timeout-minutes cuts off a stuck browser; the default would hold the
    # runner for 6 hours.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Same noble ttyd constraint as typecheck-and-test: the cockpit specs
      # drive a real tmux server and ttyd. lsof is how those specs identify
      # the live ttyd pid. Missing tools must fail this job, not skip it.
      - *ubuntu-mirror-fallback

      - name: Install live test dependencies
        run: sudo apt-get update && sudo apt-get install -y ttyd tmux lsof

      - name: Install dependencies
        run: npm ci

      - *ubuntu-mirror-fallback

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Specs serve dist/client. review-routing spawns dist/server/standalone.js.
      - name: Build client and server
        run: npm run build:all

      - name: Browser suite
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
